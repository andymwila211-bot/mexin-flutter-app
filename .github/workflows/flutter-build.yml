name: Build Mexin Play

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:

      # ─────────────────────────────────────────────
      # 1. Checkout repository
      # ─────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. Java 17
      #
      # IMPORTANT:
      # No Gradle cache here because the Gradle project
      # is still inside the ZIP at this point.
      # ─────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      # ─────────────────────────────────────────────
      # 3. Find and extract ZIP
      # ─────────────────────────────────────────────
      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted

          unzip -q -o "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | sort | head -200

      # ─────────────────────────────────────────────
      # 4. Locate Android/Gradle project
      # ─────────────────────────────────────────────
      - name: Locate Gradle Project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No settings.gradle.kts or settings.gradle found."
            echo ""
            echo "ZIP contents:"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$(realpath "$SETTINGS_FILE")")

          echo "Gradle project found:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      # ─────────────────────────────────────────────
      # 5. Verify project
      # ─────────────────────────────────────────────
      - name: Verify Project
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "Project root:"
          pwd

          echo ""
          echo "Project contents:"
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle-wrapper.properties" \) \
            -print

      # ─────────────────────────────────────────────
      # 6. Setup Gradle
      #
      # IMPORTANT:
      # This comes AFTER ZIP extraction.
      # ─────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ─────────────────────────────────────────────
      # 7. Check Gradle
      # ─────────────────────────────────────────────
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          gradle --version

      # ─────────────────────────────────────────────
      # 8. Inspect Gradle projects
      # ─────────────────────────────────────────────
      - name: Inspect Gradle Projects
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle projects --stacktrace

      # ─────────────────────────────────────────────
      # 9. Run unit tests
      # ─────────────────────────────────────────────
      - name: Run Unit Tests
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle \
            :core-player:testDebugUnitTest \
            --stacktrace \
            --no-daemon

      # ─────────────────────────────────────────────
      # 10. Build library modules
      # ─────────────────────────────────────────────
      - name: Build Library Modules
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle \
            :core-player:assembleDebug \
            :core-ui-glass:assembleDebug \
            :feature-pulse:assembleDebug \
            :feature-flux:assembleDebug \
            --stacktrace \
            --no-daemon

      # ─────────────────────────────────────────────
      # 11. Build APK
      # ─────────────────────────────────────────────
      - name: Build App APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # ─────────────────────────────────────────────
      # 12. Find APK
      # ─────────────────────────────────────────────
      - name: Locate APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "Generated APKs:"
          find . -type f -name "*.apk" -print

      # ─────────────────────────────────────────────
      # 13. Upload APK
      # ─────────────────────────────────────────────
      - name: Upload App APK
        uses: actions/upload-artifact@v4
        with:
          name: mexin-play-app-debug-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ─────────────────────────────────────────────
      # 14. Upload AARs
      # ─────────────────────────────────────────────
      - name: Upload Library AARs
        uses: actions/upload-artifact@v4
        with:
          name: mexin-play-debug-aars
          path: |
            ${{ env.PROJECT_ROOT }}/core-player/build/outputs/aar/*.aar
            ${{ env.PROJECT_ROOT }}/core-ui-glass/build/outputs/aar/*.aar
            ${{ env.PROJECT_ROOT }}/feature-pulse/build/outputs/aar/*.aar
            ${{ env.PROJECT_ROOT }}/feature-flux/build/outputs/aar/*.aar
          if-no-files-found: warn
