name: Build Mexin Play

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # 1. Checkout repository
      # ─────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. Java 17
      # ─────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      # ─────────────────────────────────────────────
      # 3. Find and extract project ZIP
      # ─────────────────────────────────────────────
      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "Using project ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted

          echo "Extracted contents:"
          find extracted -maxdepth 3 -type f | sort | head -200

      # ─────────────────────────────────────────────
      # 4. Locate actual Android project root
      # ─────────────────────────────────────────────
      - name: Locate Gradle Project
        shell: bash
        run: |
          set -e

          PROJECT_ROOT=$(find extracted -type f -name "settings.gradle.kts" -o -name "settings.gradle" \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Could not find settings.gradle.kts or settings.gradle"
            exit 1
          fi

          PROJECT_ROOT=$(realpath "$PROJECT_ROOT")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo "Project files:"
          find "$PROJECT_ROOT" -maxdepth 2 -type f | sort

      # ─────────────────────────────────────────────
      # 5. Verify Gradle wrapper
      # ─────────────────────────────────────────────
      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew is missing from the project ZIP."
            echo "Generate the wrapper locally before uploading the ZIP."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: Gradle wrapper configuration is missing."
            exit 1
          fi

          chmod +x ./gradlew

          ./gradlew --version

      # ─────────────────────────────────────────────
      # 6. Setup Gradle
      # ─────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      # ─────────────────────────────────────────────
      # 7. List Android modules
      # ─────────────────────────────────────────────
      - name: Inspect Gradle Projects
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          ./gradlew projects

      # ─────────────────────────────────────────────
      # 8. Unit tests
      # ─────────────────────────────────────────────
      - name: Run Unit Tests
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          ./gradlew \
            :core-player:testDebugUnitTest \
            --stacktrace \
            --no-daemon

      # ─────────────────────────────────────────────
      # 9. Build library modules
      # ─────────────────────────────────────────────
      - name: Build Library Modules
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          ./gradlew \
            :core-player:assembleDebug \
            :core-ui-glass:assembleDebug \
            :feature-pulse:assembleDebug \
            :feature-flux:assembleDebug \
            --stacktrace \
            --no-daemon

      # ─────────────────────────────────────────────
      # 10. Build application APK
      # ─────────────────────────────────────────────
      - name: Build App APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # ─────────────────────────────────────────────
      # 11. Find generated APKs
      # ─────────────────────────────────────────────
      - name: Locate APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "Generated APK files:"
          find . -type f -name "*.apk" -print

      # ─────────────────────────────────────────────
      # 12. Upload APK
      # ─────────────────────────────────────────────
      - name: Upload App APK
        uses: actions/upload-artifact@v4
        with:
          name: mexin-play-app-debug-apk
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ─────────────────────────────────────────────
      # 13. Upload AAR libraries
      # ─────────────────────────────────────────────
      - name: Upload Library AARs
        uses: actions/upload-artifact@v4
        with:
          name: mexin-play-debug-aars
          path: |
            ${{ env.PROJECT_ROOT }}/core-player/build/outputs/aar/*.aar
            ${{ env.PROJECT_ROOT }}/core-ui-glass/build/outputs/aar/*.aar
            ${{ env.PROJECT_ROOT }}/feature-pulse/build/outputs/aar/*.aar
            ${{ env.PROJECT_ROOT }}/feature-flux/build/outputs/aar/*.aar
          if-no-files-found: warn
